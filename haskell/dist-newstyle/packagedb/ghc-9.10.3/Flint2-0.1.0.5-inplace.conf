name:                   Flint2
version:                0.1.0.5
visibility:             public
id:                     Flint2-0.1.0.5-inplace
key:                    Flint2-0.1.0.5-inplace
license:                GPL-2.0-only
copyright:              Copyright (c) 2023 Hartmut Monien
maintainer:             hmonien@uni-bonn.de
author:                 Hartmut Monien
homepage:               https://github.com/monien/Flint2#readme
synopsis:               Haskell bindings for the flint library for number theory
description:
    This library provides access to the functionality of the FLINT.
    FLINT is a C library for doing number theory, freely available under the GNU LGPL.
    At its core, FLINT provides arithmetic in standard rings such as the integers, rationals, algebraic, real, complex and p-adic numbers, finite fields, and number fields. It also provides polynomials (univariate and multivariate), power series, and matrices.
    FLINT has been used for many large scale research computations (e.g. A Trillion Triangles) and has been cited in hundreds of publications. FLINT's authors themselves have published more than 20 papers describing new algorithms first implemented within or on top of FLINT.

category:               Math
